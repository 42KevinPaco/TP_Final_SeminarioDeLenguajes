<div class="product-card">
    <div class="product-imagen">
        {% if producto.imagen %}
            <img src="{{ url_for('imagen_producto', nombre=producto.imagen) }}" alt="{{ producto.nombre }}">
        {% else %}
            <span class="product-imagen-placeholder" aria-hidden="true">&#128722;</span>
        {% endif %}
    </div>
    <div class="product-card-header">
        <h3 class="product-name">{{ producto.nombre }}</h3>
        <span class="product-brand">{{ producto.marca }}</span>
    </div>
    <div class="product-card-body">
        <p class="product-description">{{ producto.descripcion }}</p>
        <p class="product-price">$ {{ "%.2f"|format(producto.precio) }}</p>
    </div>
    <div class="product-card-footer">
        <div class="product-card-cantidad">
            <label for="cantidad-{{ producto.id_producto }}" class="product-card-cantidad-label">Cantidad</label>
            <input type="number" id="cantidad-{{ producto.id_producto }}" class="input-cantidad"
                   value="1" min="1" step="1">
        </div>
        <button class="btn btn-primary" onclick="agregarAlCarrito({{ producto.id_producto }})">Agregar al carrito</button>
    </div>
</div>
