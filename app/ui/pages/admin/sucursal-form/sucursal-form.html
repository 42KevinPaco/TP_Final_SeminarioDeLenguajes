{% extends "components/base/layout.html" %}

{% block title %}Sucursal - Supermercado E-commerce{% endblock %}

{% block content %}
<div class="container">
    <h1 class="page-title">
        {% if sucursal %}Modificar Sucursal{% else %}Agregar Sucursal{% endif %}
    </h1>

    <form method="post" class="admin-form" novalidate>
        <div class="form-group">
            <label for="nombre" class="form-label">Nombre *</label>
            <input type="text" id="nombre" name="nombre" class="form-input"
                   value="{{ form_data.get('nombre') or (sucursal.nombre if sucursal else '') }}">
        </div>

        <div class="form-group">
            <label for="direccion" class="form-label">Dirección *</label>
            <input type="text" id="direccion" name="direccion" class="form-input"
                   value="{{ form_data.get('direccion') or (sucursal.direccion if sucursal else '') }}">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="latitud" class="form-label">Latitud *</label>
                <input type="number" id="latitud" name="latitud" class="form-input"
                       min="-90" max="90" step="0.0001"
                       value="{{ form_data.get('latitud') or (sucursal.latitud if sucursal else '') }}">
            </div>
            <div class="form-group">
                <label for="longitud" class="form-label">Longitud *</label>
                <input type="number" id="longitud" name="longitud" class="form-input"
                       min="-180" max="180" step="0.0001"
                       value="{{ form_data.get('longitud') or (sucursal.longitud if sucursal else '') }}">
            </div>
        </div>

        <button type="submit" class="btn btn-primary">
            {% if sucursal %}Guardar cambios{% else %}Crear sucursal{% endif %}
        </button>
        <a href="{{ url_for('admin_sucursales') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
