{% extends "components/base/layout.html" %}

{% block title %}Producto - Supermercado E-commerce{% endblock %}

{% block content %}
<div class="container">
    <h1 class="page-title">
        {% if producto %}Modificar Producto{% else %}Agregar Producto{% endif %}
    </h1>

    <form method="post" enctype="multipart/form-data" class="admin-form" novalidate>
        <div class="form-group">
            <label for="nombre" class="form-label">Nombre *</label>
            <input type="text" id="nombre" name="nombre" class="form-input"
                   value="{{ form_data.get('nombre') or (producto.nombre if producto else '') }}">
        </div>

        <div class="form-group">
            <label for="descripcion" class="form-label">Descripción *</label>
            <textarea id="descripcion" name="descripcion" class="form-input" rows="3">{{ form_data.get('descripcion') or (producto.descripcion if producto else '') }}</textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="precio" class="form-label">Precio *</label>
                <input type="number" id="precio" name="precio" class="form-input"
                       min="0" step="0.01"
                       value="{{ form_data.get('precio') or (producto.precio if producto else '') }}">
            </div>
            <div class="form-group">
                <label for="marca" class="form-label">Marca *</label>
                <input type="text" id="marca" name="marca" class="form-input"
                       value="{{ form_data.get('marca') or (producto.marca if producto else '') }}">
            </div>
        </div>

        <div class="form-group">
            <label for="imagen" class="form-label">Imagen (opcional)</label>
            {% if producto and producto.imagen %}
                <img src="{{ url_for('imagen_producto', nombre=producto.imagen) }}"
                     alt="{{ producto.nombre }}" class="admin-miniatura">
            {% endif %}
            <input type="file" id="imagen" name="imagen" class="form-input"
                   accept="image/jpeg,image/png,image/webp,image/gif">
        </div>

        <button type="submit" class="btn btn-primary">
            {% if producto %}Guardar cambios{% else %}Crear producto{% endif %}
        </button>
        <a href="{{ url_for('admin_productos') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
